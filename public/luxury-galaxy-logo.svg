<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dff6a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#2de354" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#149e3c" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eff7e" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#32d75a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f7a30" stop-opacity="0.85" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container from Canva -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#06120e" stroke="#144230" stroke-width="1.5" />
  
  <!-- Outer Cosmic Dust / Atmosphere -->
  <circle cx="32" cy="32" r="14" fill="#4dff6a" opacity="0.08" filter="blur(6px)" />

  <!-- Orbit 1 (Tilted Ellipse) -->
  <ellipse cx="32" cy="32" rx="20" ry="7.5" transform="rotate(-24 32 32)" stroke="url(#orbitGrad1)" stroke-width="2.6" stroke-linecap="round" filter="url(#emeraldGlow)" />

  <!-- Orbit 2 (Counter-Tilted Ellipse) -->
  <ellipse cx="32" cy="32" rx="20" ry="7.5" transform="rotate(32 32 32)" stroke="url(#orbitGrad2)" stroke-width="2.6" stroke-linecap="round" filter="url(#emeraldGlow)" />

  <!-- Central Glowing Cosmic Core -->
  <circle cx="32" cy="32" r="5.5" fill="#4dff6a" filter="url(#emeraldGlow)" />
  <circle cx="32" cy="32" r="3.5" fill="#a6ffb6" />
</svg>
